<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bastion Defense</title>
<style>
:root{color-scheme:dark;--bg:#14181f;--pn:#1e252f;--ln:#34404f;--tx:#e8edf3;--mu:#93a1b3;--ac:#ffb020;--ok:#4ade80;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#2b3e5a 0,transparent 45%),radial-gradient(circle at 95% 25%,#3d2a58 0,transparent 40%),repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 40px),linear-gradient(#151a23,#0d1016);background-attachment:fixed}
h1,h2{font-family:Georgia,serif;margin:0}
h1{font-size:32px;letter-spacing:1px;background:linear-gradient(90deg,#ffd35a,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{border-left:4px solid var(--ac);padding-left:8px}
.top{flex-wrap:wrap;gap:8px}
#app{max-width:860px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.coins{background:var(--pn);border:2px solid var(--ac);border-radius:20px;padding:6px 14px;font-weight:700;color:var(--ac)}
h2{font-size:18px;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:10px;color:var(--tx);text-align:left;font:inherit;cursor:pointer}
.card.sel{border-color:var(--ac)}
.card b{display:block}.card small{color:var(--mu)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}
button{font:inherit}
.pg,#hub,#bk{display:none}
#menu[data-v=h] #hub{display:grid}
#menu:not([data-v=h]) #bk{display:inline-block;margin-bottom:6px}
#menu[data-v=p] .pp,#menu[data-v=s] .ps,#menu[data-v=k] .pk,#menu[data-v=q] .pq{display:block}
.card{background:linear-gradient(160deg,#243040,#1a212b);transition:transform .15s,border-color .15s;box-shadow:0 2px 0 #0006}
.card:hover{transform:translateY(-2px);border-color:#5b6f86}
.card.sel{box-shadow:0 0 14px #ffb02055}
.btn{box-shadow:0 3px 0 #0007}
.btn.play{background:linear-gradient(#ffcb47,#ff9a1f);font-size:20px;letter-spacing:1px}
.coins{display:flex;gap:14px;background:linear-gradient(#2a2f3a,#1c2129)}
#hub{gap:14px;margin:18px 0}
.hb{padding:22px 18px;display:flex;flex-direction:column;gap:6px;min-height:110px}
.hb b{font-size:20px}.hb i{font-style:normal;font-size:34px}
.hb.p{border-color:#4ade80}.hb.s{border-color:#60a5fa}.hb.k{border-color:#c084fc}.hb.q{border-color:#ffb020}
#show{display:none;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0;padding:14px;background:#0004;border:1px solid var(--ln);border-radius:14px}
#menu[data-v=h] #show{display:flex}
#tag{color:var(--mu);margin:2px 0 0}
canvas.ic.big{width:64px;height:64px;margin:0}
.bar{height:6px;background:var(--ln);border-radius:3px;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
canvas.ic{width:34px;height:34px;display:inline-block;border:0;border-radius:0;vertical-align:middle;margin-right:6px}
.btn{background:var(--ac);color:#201400;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn:disabled,.dim{opacity:.45}
.btn.alt{background:var(--ln);color:var(--tx)}
.play{width:100%;margin-top:16px;padding:14px;font-size:18px}
#game{display:none}
.wrap{position:relative}
canvas{width:100%;display:block;border:2px solid var(--ln);border-radius:8px;touch-action:none}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-weight:700}
.hud span{background:var(--pn);padding:4px 10px;border-radius:8px}
#bar{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
#bar .card{min-width:112px;padding:6px 8px}
#panel{background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:10px;margin-top:8px;min-height:64px}
#ov{position:absolute;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;border-radius:8px}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000c;padding:4px 12px;border-radius:8px;display:none}
</style></head><body><div id="app">
<div id="menu" data-v="h">
<div class="top"><div><h1>Bastion Defense</h1><p id="tag"></p></div><div class="coins" id="coins"></div></div>
<div id="show"><canvas class="ic big" width="96" height="96" data-i="scout"></canvas><canvas class="ic big" width="96" height="96" data-i="soldier"></canvas><canvas class="ic big" width="96" height="96" data-i="freezer"></canvas><canvas class="ic big" width="96" height="96" data-i="sniper"></canvas><canvas class="ic big" width="96" height="96" data-i="shotgun"></canvas><canvas class="ic big" width="96" height="96" data-i="laser"></canvas><canvas class="ic big" width="96" height="96" data-i="mortar"></canvas><canvas class="ic big" width="96" height="96" data-i="buff"></canvas></div>
<div id="hub" class="grid"><button class="card hb p" data-v="p"><i>⚔️</i><b>Play</b><small>Choose a map and game mode, then start</small></button><button class="card hb s" data-v="s"><i>🛒</i><b>Tower shop</b><small>Unlock new towers</small></button><button class="card hb k" data-v="k"><i>🎁</i><b>Skins and crates</b><small>Gold skins, crates and your skins</small></button><button class="card hb q" data-v="q"><i>📜</i><b>Quests and achievements</b><small>Earn bonus coins</small></button></div>
<button class="btn alt" id="bk" data-v="h">Back to main menu</button>
<div class="pg pq"><h2>Daily quests</h2><div class="grid" id="qs"></div></div>
<div class="pg ps"><h2>Coin towers</h2><div class="grid" id="shop"></div><h2>Hardcore towers (gems)</h2><div class="grid" id="shop2"></div></div>
<div class="pg pk"><h2>Gold skins</h2><div class="grid" id="gs"></div>
<h2>Skin crates</h2><div id="cr" style="color:var(--ac);margin-bottom:6px"></div><div class="grid" id="cs"></div>
<h2>Your skins</h2><div class="grid" id="os"></div>
</div>
<div class="pg pp"><h2>Map</h2><div class="grid" id="maps"></div>
<h2>Game mode</h2><div class="grid" id="modes"></div></div>
<div class="pg pq"><h2>Achievements</h2><div class="grid" id="ac"></div></div>
<button class="btn play pg pp" id="go">Start game</button>
</div>
<div id="game">
<div class="hud"><span id="hl"></span><span id="hc"></span><span id="hw"></span>
<button class="btn" id="nw">Start wave 1</button><button class="btn alt" id="sp">Speed 1x</button><button class="btn alt" id="qt">Quit</button></div>
<div class="wrap"><canvas id="cv" width="800" height="480"></canvas><div id="toast"></div>
<div id="ov"><h1 id="ot"></h1><div id="od"></div><button class="btn" id="ob">Back to menu</button></div></div>
<div id="bar"></div><div id="panel">Pick a tower below, then tap the map to place it. Tap a placed tower to upgrade it.</div>
</div></div>
<script>
const $=i=>document.getElementById(i);
let S={coins:0,owned:['scout'],wins:0,q:null,ach:{},st:{},skin:0,sko:[0],tsk:{},tse:{},pity:{},gems:0,gld:{}};
try{const s=JSON.parse(localStorage.getItem('bd1'));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('bd1',JSON.stringify(S))}catch(e){}};
const T={
scout:{n:'Scout',p:0,c:100,r:110,d:8,f:.7,col:'#4ade80',ds:'Balanced starter tower.'},
soldier:{n:'Soldier',p:250,c:200,r:100,d:5,f:.25,col:'#60a5fa',ds:'Very fast firing.'},
freezer:{n:'Freezer',p:500,c:250,r:90,d:1,f:1.2,col:'#67e8f9',fz:1,ds:'Upgrades boost slow strength. Max level freezes enemies into ice cubes.'},
farm:{n:'Farm',p:800,c:300,r:0,d:0,f:0,col:'#a3e635',farm:1,ds:'Earns cash every wave. Income scales fast with upgrades.'},
sniper:{n:'Sniper',p:1200,c:450,r:270,d:55,f:2,col:'#f59e0b',ds:'Huge range and damage.'},
demo:{n:'Demoman',p:2000,c:600,r:120,d:26,f:1.5,col:'#f87171',sp:55,gr:1,ds:'Splash damage. Ground only.'},
minigun:{n:'Minigunner',p:3000,c:700,r:120,d:4,f:.1,col:'#94a3b8',ds:'Insane fire rate.'},
pyro:{n:'Pyro',p:3500,c:650,r:75,d:3,f:.12,col:'#fb923c',sp:28,ds:'Short-range flames that burn groups.'},
electro:{n:'Electro',p:4500,c:800,r:130,d:14,f:.9,col:'#c084fc',ch:3,ds:'Lightning chains to 3 enemies.'},
mortar:{n:'Mortar',p:6000,c:900,r:300,d:80,f:3.2,col:'#a8a29e',sp:70,gr:1,ds:'Long range, huge blast. Ground only.'},
shotgun:{n:'Shotgunner',p:1800,c:450,r:105,d:20,f:.7,col:'#d97706',sh:1,ds:'Blasts a wide cone of pellets, every pellet hits at full damage.'},
trapper:{n:'Trapper',p:4000,c:550,r:130,d:10,f:3,col:'#facc15',trap:1,gr:1,ds:'Lays Spike, Goo or Mine traps on the path. Ground only.'},
laser:{n:'Laser',p:5000,c:850,r:190,d:18,f:.45,col:'#22d3ee',ls:1,ds:'Beam pierces every enemy in a line.'},
buff:{n:'Commander',p:5500,c:700,r:110,d:0,f:0,col:'#fbbf24',buff:1,ds:'Boosts damage and speed of nearby towers.'},
accel:{n:'Accelerator',p:150,gem:1,c:550,r:105,d:0,f:0,col:'#f43f5e',ac:1,ds:'Boosts the fire rate of nearby towers by 30%.'},
engineer:{n:'Engineer',p:200,gem:1,c:600,r:115,d:8,f:.55,col:'#f59e0b',eng:1,ds:'Shoots and deploys sentries that hit extra targets.'},
brawler:{n:'Brawler',p:250,gem:1,c:500,r:60,d:18,f:.6,col:'#ef4444',bw:1,gr:1,ds:'Melee spin that hits everything nearby and knocks enemies back. Ground only.'},
necro:{n:'Necromancer',p:400,gem:1,c:800,r:0,d:0,f:0,col:'#a78bfa',nec:1,ds:'Raises skeleton minions that walk the path and fight.'},
base:{n:'Military Base',p:9000,c:900,r:0,d:0,f:0,col:'#65a30d',mil:1,ds:'Sends jeeps (and tanks at level 3) down the path to kill enemies.'}};
const px=a=>a.map(p=>[p[0]*40+20,p[1]*40+20]);
const M=[
{n:'Grass Fields',bg:'#2f5d3a',pc:'#a9855a',p:px([[-1,1],[17,1],[17,5],[2,5],[2,9],[20,9]])},
{n:'Desert Loop',bg:'#a8874f',pc:'#6b5232',p:px([[-1,6],[4,6],[4,2],[10,2],[10,9],[16,9],[16,4],[20,4]])},
{n:'Frozen Zigzag',bg:'#5b7f99',pc:'#d6e6f0',p:px([[-1,2],[5,2],[5,9],[9,2],[13,9],[17,2],[17,10],[20,10]])}];
const MO=[
{n:'Easy',w:10,h:.8,l:30,c:600,r:150,ds:'10 waves, weaker enemies'},
{n:'Normal',w:15,h:1,l:20,c:550,r:350,ds:'15 waves'},
{n:'Hard',w:20,h:1.5,l:10,c:500,r:800,ds:'20 waves, tough enemies'},
{n:'Endless',w:0,h:1,l:15,c:550,r:0,ds:'Survive as long as you can'},
{n:'Hardcore',w:25,h:2.2,l:3,c:500,r:0,gem:1,ds:'25 waves, brutal enemies, only 3 lives. Earn gems.'}];
const E={n:{hp:20,sp:55,l:1,col:'#e5e7eb',r:8,rw:4},f:{hp:14,sp:100,l:1,col:'#fde047',r:6,rw:4},
t:{hp:100,sp:38,l:2,col:'#a78bfa',r:11,rw:10},b:{hp:700,sp:28,l:10,col:'#ef4444',r:15,rw:60},
a:{hp:60,sp:42,l:2,col:'#9ca3af',r:10,rw:9,ar:4},w:{hp:30,sp:80,l:1,col:'#f0abfc',r:7,rw:7,fly:1},
h:{hp:50,sp:50,l:1,col:'#86efac',r:9,rw:9,heal:1},x:{hp:2000,sp:24,l:99,col:'#7f1d1d',r:20,rw:300,ar:3,crown:1},s:{hp:80,sp:45,l:2,col:'#fb923c',r:11,rw:8,split:1}};
let sm=0,so=0,G=null,pick=null,hover=null,spd=1;
function menu(){
$('coins').innerHTML='<span>🪙 '+S.coins+'</span><span>💎 '+(S.gems||0)+'</span>';$('tag').textContent='Defend the path. '+S.wins+' wins · '+S.owned.length+' of '+Object.keys(T).length+' towers unlocked';dq();
$('qs').innerHTML=S.q.list.map(q=>`<div class="card ${q.done?'sel':''}"><b>${q.n}</b><small>${q.done?'Complete!':Math.min(q.p,q.g)+'/'+q.g} · Reward ${q.r} coins</small><div class="bar"><i style="width:${Math.min(100,q.p/q.g*100)}%"></i></div></div>`).join('');
$('ac').innerHTML=AC.map(a=>`<div class="card ${S.ach[a.id]?'sel':'dim'}"><b>${S.ach[a.id]?'✓ ':''}${a.n}</b><small>${a.d} · ${a.r} coins</small></div>`).join('');
shopRender();const _y=Object.keys({}).map(k=>{const t=T[k],o=S.owned.includes(k);
return `<button class="card ${o?'':'dim'}" data-b="${k}"><b><canvas class="ic" width="34" height="34" data-i="${k}"></canvas>${t.n}</b><small>${t.ds}</small><br>${o?'Owned':'Buy: '+t.p+(t.gem?' gems':' coins')}</button>`}).join('');
$('cr').textContent=cr;$('cs').innerHTML=crh();$('gs').innerHTML=gsh();$('os').innerHTML=osh();const _x=Object.keys({}).map(k=>{const s=TS[k],o=S.tsk[k];return `<button class="card ${o?'sel':''}" data-c="${k}"><b><canvas class="ic" width="34" height="34" data-i="${k}" data-pv="1"></canvas>${s.n}</b><small style="color:${RC[s.rar]}">${RN[s.rar]}</small><br><small>${o?(S.tse[k]?'Equipped (tap to unequip)':'Owned (tap to equip)'):'Open crate: '+CP[s.rar]+' coins · '+Math.round((CH[s.rar]+.05*(S.pity[k]||0))*100)+'% chance'}</small></button>`}).join('');
const _z=SK.map((s,i)=>`<button class="card ${i==S.skin?'sel':''} ${S.sko.includes(i)?'':'dim'}" data-s="${i}"><b>${s.n}</b><small>${S.sko.includes(i)?(i==S.skin?'Equipped':'Tap to equip'):'Buy: '+s.p+' coins'}</small></button>`).join('');
icons();$('maps').innerHTML=M.map((m,i)=>`<button class="card ${i==sm?'sel':''}" data-m="${i}"><b>${m.n}</b></button>`).join('');
$('modes').innerHTML=MO.map((m,i)=>`<button class="card ${i==so?'sel':''}" data-o="${i}"><b>${m.n}</b><small>${m.ds}</small><br><small>Win reward: ${m.gem?'Gems: 4 per wave + 100 for winning':m.r?m.r+' coins':'12 per wave'}</small></button>`).join('');}
document.addEventListener('click',e=>{const c=e.target.closest('[data-b],[data-m],[data-o],[data-s],[data-c],[data-e],[data-g]');if(!c||G)return;
if(c.dataset.b){const k=c.dataset.b,t=T[k];if(!S.owned.includes(k)){if(t.gem?S.gems>=t.p:S.coins>=t.p){if(t.gem)S.gems-=t.p;else S.coins-=t.p;S.owned.push(k);ev('buy',0);save()}}}
if(c.dataset.g)buyGold(c.dataset.g);if(c.dataset.c!==undefined)crateClick(+c.dataset.c);if(c.dataset.e)eqSkin(c.dataset.e);if(false){const k=0,s=TS.scout,cost=0;
if(S.tsk[k]){S.tse[k]=!S.tse[k];cr=''}
else if(S.coins<cost)cr='Not enough coins for the '+s.n+' crate.';
else{S.coins-=cost;const ch=CH[s.rar]+.05*(S.pity[k]||0);
if(Math.random()<ch){S.tsk[k]=1;S.tse[k]=1;S.pity[k]=0;cr='You pulled '+s.n+' ('+RN[s.rar]+')! It is equipped.'}
else{S.pity[k]=(S.pity[k]||0)+1;const b=Math.floor(cost*.4);S.coins+=b;cr='No luck on the '+s.n+' crate. You got '+b+' coins back and +5% chance next time.'}}save()}
if(c.dataset.s){const i=+c.dataset.s,s=SK[i];if(!S.sko.includes(i)&&S.coins>=s.p){S.coins-=s.p;S.sko.push(i)}if(S.sko.includes(i))S.skin=i;save()}
if(c.dataset.m)sm=+c.dataset.m;if(c.dataset.o)so=+c.dataset.o;menu()});
const segd=(x,y,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];let t=((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)};
function start(){const m=MO[so],mp=M[sm];let L=0;const sg=[];
for(let i=1;i<mp.p.length;i++){const a=mp.p[i-1],b=mp.p[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);sg.push({a,b,l,s:L});L+=l}
G={m,mp,sg,L,lives:m.l,cash:m.c,w:0,run:false,q:[],st:0,en:[],tw:[],tr:[],un:[],fx:[],sel:null,over:false};
pick=null;spd=1;$('sp').textContent='Speed 1x';$('nw').disabled=false;
$('menu').style.display='none';$('game').style.display='block';$('ov').style.display='none';
$('bar').innerHTML=S.owned.map((k,i)=>`<button class="card" data-p="${k}"><b>${i<9?'['+(i+1)+'] ':''}<canvas class="ic" width="34" height="34" data-i="${k}"></canvas>${T[k].n}</b><small>$${T[k].c}</small></button>`).join('');
panel();hud();}
$('go').onclick=start;
$('bar').onclick=e=>{const c=e.target.closest('[data-p]');if(!c)return;pick=pick==c.dataset.p?null:c.dataset.p;G.sel=null;panel()};
const posAt=d=>{for(const s of G.sg)if(d<=s.s+s.l){const t=(d-s.s)/s.l;return[s.a[0]+(s.b[0]-s.a[0])*t,s.a[1]+(s.b[1]-s.a[1])*t]}return G.mp.p[G.mp.p.length-1]};
const dmg=t=>T[t.k].d*(1+.7*(t.lv-1))*bf(t)*(S.gld[t.k]?1.25:1),rng=t=>T[t.k].r*(1+.07*(t.lv-1))*(S.gld[t.k]?1.1:1),rate=t=>T[t.k].f*Math.pow(.88,t.lv-1)/bf(t)/af(t)/(S.gld[t.k]?1.15:1),upc=t=>Math.floor(T[t.k].c*(.7+.4*t.lv));
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1200)}
function valid(x,y){if(x<16||y<16||x>784||y>464)return false;
for(const s of G.sg)if(segd(x,y,s.a,s.b)<32)return false;
return !G.tw.some(t=>Math.hypot(t.x-x,t.y-y)<30)}
function mk(w){let l=[];const add=(k,n)=>{for(let i=0;i<n;i++)l.push(k)};
const i=(w-1)%5;thn=['Standard wave','Speed rush','Armored column','Air raid','Mixed assault'][i];
add('n',4+w*2-(i==1||i==3?w:0));
if(i==0){if(w>=3)add('f',w>>1);if(w>=5)add('t',(w-3)>>1)}
if(i==1)add('f',4+w*2);
if(i==2)add('a',1+(w>>1));
if(i==3)add('w',2+(w>>1));
if(i==4){add('s',1+(w>>2));if(w>=4)add('h',1+(w>>3));add('t',w>>2)}
if(w%5==0)add('b',w/5);
l.sort(()=>Math.random()-.5);if(G.m.w&&w==G.m.w)l.unshift('x');return l}
$('nw').onclick=()=>{if(G.run||G.over)return;G.w++;G.q=mk(G.w);toast(G.m.w&&G.w==G.m.w?'FINAL WAVE: BOSS INCOMING!':thn+(G.w%5==0?' + BOSS':''));G.st=0;G.run=true;$('nw').disabled=true;hud()};
$('sp').onclick=()=>{spd=spd==1?2:spd==2?3:1;$('sp').textContent='Speed '+spd+'x'};
$('qt').onclick=()=>finish(false,true);
const cvp=e=>{const r=$('cv').getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*480/r.height]};
$('cv').onmousemove=e=>hover=cvp(e);
$('cv').onclick=e=>{if(!G||G.over)return;const[x,y]=cvp(e);hover=[x,y];
const hit=G.tw.find(t=>Math.hypot(t.x-x,t.y-y)<17);
if(hit){G.sel=hit;pick=null;panel();return}
if(pick){const c=T[pick].c;if(!valid(x,y))return toast("Can't build here");if(G.cash<c)return toast('Not enough cash');
G.cash-=c;G.tw.push({k:pick,x,y,lv:1,cd:0,sp:c});ev('place');hud();return}
G.sel=null;panel()};
function panel(){icons();const p=$('panel'),t=G&&G.sel;
