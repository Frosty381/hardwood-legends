<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON DRIFT — CYBER</title><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:#f5f7ff;font:15px system-ui;overflow:hidden}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:22px;display:flex;justify-content:space-between;align-items:flex-start}#panel{background:#080b14c9;border:1px solid #ffffff26;border-radius:13px;padding:14px 18px;backdrop-filter:blur(12px);max-width:340px}h1{font-size:24px;margin:0 0 5px}#goal{color:#b7c2d9;font-size:12px;line-height:1.5}#score{font-size:24px;font-weight:900;margin-top:7px;color:var(--accent)}#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#080b14c9;border:1px solid #ffffff2b;border-radius:30px;padding:10px 18px;font-size:12px;color:#d5def2;white-space:nowrap}#start{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#24314eaa,#050711ed 70%);display:grid;place-items:center;z-index:5}#card{width:min(440px,calc(100% - 36px));padding:32px;border-radius:20px;border:1px solid #ffffff30;background:#101729ef;text-align:center;box-shadow:0 25px 90px #0009}#card .emoji{font-size:60px}#card h2{font-size:32px;margin:8px 0}#card p{color:#b6c2d9;line-height:1.6}button{border:0;border-radius:9px;background:var(--accent);color:#08101b;font-weight:900;padding:13px 24px;cursor:pointer}#result{display:none;position:fixed;inset:0;background:#050711dd;z-index:8;place-items:center;text-align:center}#result>div{padding:32px;background:#111a2b;border:1px solid #ffffff30;border-radius:18px}#touch{display:none;position:fixed;bottom:75px;right:18px;gap:8px}#touch button{padding:15px;background:#15243bdc;color:white}@media(max-width:700px){#touch{display:flex}#help{font-size:10px;bottom:14px}#hud{padding:12px}#panel{max-width:250px}}</style></head><body><div id="hud"><div id="panel"><h1>NEON DRIFT</h1><div id="goal">Survive the neon highway and collect 12 energy rings.</div><div id="score">PROGRESS 0/12</div></div></div><div id="help">WASD / ARROWS MOVE · MOUSE LOOK · SPACE / E ACTION</div><div id="touch"><button data-key="KeyW">↑</button><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button><button data-key="Space">ACTION</button></div><div id="start"><div id="card"><div class="emoji">🏎️</div><h2>NEON DRIFT</h2><p><b>Racing</b><br>Race a glowing highway, dodge traffic and chase your best distance.<br><br>Survive the neon highway and collect 12 energy rings.</p><button id="startBtn">START GAME</button></div></div><div id="result"><div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="restart">PLAY AGAIN</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const cfg={"title":"NEON DRIFT","genre":"Racing","desc":"Race a glowing highway, dodge traffic and chase your best distance.","emoji":"🏎️","color":"#00d9ff","goal":"Survive the neon highway and collect 12 energy rings.","kind":"race","target":12};document.documentElement.style.setProperty('--accent',cfg.color);const clock=new THREE.Clock(),scene=new THREE.Scene();scene.background=new THREE.Color(cfg.kind==='horror'?'#090916':cfg.kind==='ocean'?'#06304a':'#080e20');scene.fog=new THREE.Fog(scene.background,22,95);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);camera.position.set(0,5,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xb9d9ff,0x202033,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(8,15,7);sun.castShadow=true;scene.add(sun);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.42,metalness:.2});const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(cfg.kind==='ocean'?'#07516a':'#151d2d'));floor.rotation.x=-Math.PI/2;floor.position.y=-.1;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(100,50,0x526080,0x29354a);grid.position.y=.01;scene.add(grid);const player=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,5,10),mat(cfg.color)),head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),mat('#e0b48e'));body.position.y=1;head.position.y=1.85;body.castShadow=true;player.add(body,head);scene.add(player);const pickups=[],enemies=[];function block(x,y,z,sx,sy,sz,color,sphere=false){const m=new THREE.Mesh(sphere?new THREE.SphereGeometry(sx,18,14):new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}for(let i=0;i<34;i++){let x=(Math.random()-.5)*55,z=(Math.random()-.5)*55;if(Math.hypot(x,z)<6)z+=9;block(x,.7,z,1+Math.random()*2,1+Math.random()*3,1+Math.random()*2,cfg.color)}for(let i=0;i<18;i++)pickups.push(block((Math.random()-.5)*38,.8,(Math.random()-.5)*38,.34,.34,.34,i%2?'#f5cf66':'#76f4d0',true));for(let i=0;i<7;i++)enemies.push(block((Math.random()-.5)*35,.8,(Math.random()-.5)*35,.65,1.2,.65,cfg.kind==='horror'?'#8b314d':'#d15b58'));let running=false,score=0,hp=100,keys={},yaw=0,won=false;const scoreEl=document.getElementById('score');function hud(){scoreEl.textContent='PROGRESS '+score+'/'+cfg.target}function finish(ok){if(won)return;won=true;document.getElementById('result').style.display='grid';document.getElementById('resultTitle').textContent=ok?'MISSION COMPLETE':'TRY AGAIN';document.getElementById('resultText').textContent=ok?'Great run!':'You were caught. Try again.'}function start(){document.getElementById('start').style.display='none';running=true;renderer.domElement.requestPointerLock?.();animate()}document.getElementById('startBtn').onclick=start;document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement)yaw-=e.movementX*.002});document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.getElementById('restart').onclick=()=>location.reload();function animate(){if(!running||won)return;requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),st=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),speed=(cfg.kind==='race'?13:7)*((keys.ShiftLeft||keys.ShiftRight)?1.55:1);player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*st)*speed*dt;player.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*st)*speed*dt;player.position.x=Math.max(-48,Math.min(48,player.position.x));player.position.z=Math.max(-48,Math.min(48,player.position.z));player.rotation.y=yaw;camera.position.lerp(new THREE.Vector3(player.position.x+Math.sin(yaw)*7,player.position.y+5,player.position.z+Math.cos(yaw)*7),.09);camera.lookAt(player.position.x,1.2,player.position.z);enemies.forEach((e,i)=>{e.position.y=.8+Math.sin(performance.now()*.002+i)*.12;if((cfg.kind==='horror'||cfg.kind==='survival')&&e.position.distanceTo(player.position)<13){e.position.lerp(new THREE.Vector3(player.position.x,.8,player.position.z),dt*.1);if(e.position.distanceTo(player.position)<1.4){hp-=dt*15;if(hp<=0)finish(false)}}});for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];p.rotation.y+=dt*1.8;p.position.y=.8+Math.sin(performance.now()*.002+i)*.18;if(p.position.distanceTo(player.position)<1.6){scene.remove(p);pickups.splice(i,1);score++;hud();if(score>=cfg.target)finish(true)}}if(cfg.kind==='race'){score+=dt*5;hud();if(score>=cfg.target)finish(true)}if(cfg.kind==='space'||cfg.kind==='mech'){if(keys.Space){keys.Space=false;const e=enemies.find(x=>x.visible&&x.position.distanceTo(player.position)<18);if(e){scene.remove(e);e.visible=false;score++;hud();if(score>=cfg.target)finish(true)}}}if(cfg.kind==='puzzle'&&keys.KeyE){keys.KeyE=false;score++;hud();if(score>=cfg.target)finish(true)}if(cfg.kind==='platform'&&keys.Space&&player.position.y<.1)player.userData.v=8;if(cfg.kind==='platform'){player.userData.v=(player.userData.v||0)-18*dt;player.position.y+=player.userData.v*dt;if(player.position.y<0){player.position.y=0;player.userData.v=0}}if(window.CYBER_GAME?.tick)window.CYBER_GAME.tick(dt);renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight)});window.CYBER_GAME={cfg,scene,camera,renderer,player,pickups,enemies,block,mat,floor,grid};hud();</script><script src="cyber-worlds.js"></script></body></html>
