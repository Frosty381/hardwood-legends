<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Runner | CYBER</title><style>*{box-sizing:border-box}body{margin:0;background:#080910;color:#f5f6fb;font:14px system-ui;overflow:hidden}header{height:58px;background:#0d1120;border-bottom:1px solid #ffffff22;display:flex;align-items:center;justify-content:space-between;padding:0 18px}a,button{color:white;background:#171d31;border:1px solid #ffffff30;border-radius:7px;padding:9px 13px;text-decoration:none;font-weight:800;cursor:pointer}main{height:calc(100vh - 58px);display:grid;place-items:center;position:relative;padding:12px}canvas{width:min(100%,1200px);height:min(100%,720px);border:1px solid #ffffff30;border-radius:12px;background:#0b1020}.hud{position:absolute;top:25px;left:25px;right:25px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 8px #000}.overlay{position:absolute;inset:12px;display:grid;place-items:center;background:#050711bb;backdrop-filter:blur(7px)}.panel{width:min(460px,90%);background:#141a2b;border:1px solid #ffffff30;border-radius:15px;padding:28px;text-align:center;box-shadow:0 20px 80px #000}h1{font-size:clamp(38px,7vw,64px);line-height:.9;margin:14px 0;text-transform:uppercase}p{color:#b5bfd4;line-height:1.7}.cyan{color:#55d8ff}.primary{background:linear-gradient(110deg,#9d6bff,#547cff);border:0;padding:13px 22px}</style></head><body>
<header><b><span class="cyan">C</span> CYBER / NEON RUNNER</b><div><a href="index.html">CYBER HOME</a> <button id="pause">PAUSE</button> <button id="sound">SOUND ON</button></div></header>
<main><canvas id="c" width="1200" height="720"></canvas><div class="hud"><span>NEON RUNNER</span><span>SCORE: <b id="score">0</b></span></div>
<div class="overlay" id="overlay"><div class="panel"><div class="cyan">CYBER ORIGINAL</div><h1>Neon Runner</h1><p id="desc">Dash through a glowing city. Leap over barriers, slide under hazards and collect energy.</p><p><small>SPACE / UP TO JUMP · DOWN TO SLIDE · P TO PAUSE</small></p><button class="primary" id="start">START GAME</button></div></div></main>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector('#'+s);
let active=false,paused=false,sound=true,score=0,t=0,last=0,keys={},parts=[];
function beep(f=500){if(!sound)return;try{let a=new AudioContext(),o=a.createOscillator(),v=a.createGain();o.frequency.value=f;o.connect(v);v.connect(a.destination);v.gain.value=.025;o.start();v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.stop(a.currentTime+.1)}catch(e){}}
function start(){active=true;paused=false;score=0;t=0;parts=[];resetGame();$('overlay').style.display='none';$('score').textContent=0}
function end(){$('overlay').style.display='grid';$('start').textContent='PLAY AGAIN';$('desc').textContent='Run complete — score: '+score+'. Try again and beat your record.';active=false}
function toggle(){if(!active)return;paused=!paused;$('overlay').style.display=paused?'grid':'none';$('start').textContent='RESUME';$('desc').textContent='Game paused. Ready when you are.'}
$('start').onclick=()=>{if(active&&paused){toggle();return}start()};$('pause').onclick=toggle;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='SOUND '+(sound?'ON':'OFF')};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='p')toggle()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let py=0,vy=0,speed=8,obs=[],coins=[],ground=570,slide=0;
function resetGame(){py=0;vy=0;speed=8;obs=[];coins=[];slide=0}
function update(d){speed=Math.min(15,8+score/450);score+=Math.floor(speed*d/5);if(t%48<d)obs.push({x:1240,w:38,h:45+Math.random()*55});if(t%65<d)for(let i=0;i<3;i++)coins.push({x:1240+i*36,y:ground-100-Math.sin(i)*30});
obs.forEach(o=>o.x-=speed*d);coins.forEach(q=>q.x-=speed*d);obs=obs.filter(o=>o.x>-70);coins=coins.filter(q=>q.x>-30);
if(py<0){vy+=.9*d;py=Math.min(0,py+vy*d)}if(slide>0)slide-=d;
if((keys[' ']||keys.arrowup||keys.w)&&py===0){vy=-17;py=-1;beep(700)}if(keys.arrowdown||keys.s)slide=10;
for(let o of obs){let h=slide?36:68;if(205>o.x&&160<o.x+o.w&&ground-68+py+h>ground-o.h+5)end()}
coins.forEach(q=>{if(Math.hypot(q.x-185,q.y-(ground-35+py))<25){q.got=true;score+=25;beep(950)}});coins=coins.filter(q=>!q.got)}
function draw(){let sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#17234a');sky.addColorStop(1,'#321d4c');g.fillStyle=sky;g.fillRect(0,0,1200,720);
for(let i=0;i<7;i++){let xx=(i*210-t*1.2%1400+1400)%1400-100;g.fillStyle='#b5c7ff12';g.beginPath();g.moveTo(xx,570);g.lineTo(xx+85,250+i%3*40);g.lineTo(xx+180,570);g.fill()}
g.fillStyle='#101827';g.fillRect(0,ground,1200,150);g.strokeStyle='#55d8ff';g.lineWidth=3;g.beginPath();g.moveTo(0,ground);g.lineTo(1200,ground);g.stroke();
obs.forEach(o=>{g.fillStyle='#ff477e';g.fillRect(o.x,ground-o.h,o.w,o.h)});coins.forEach(q=>{g.fillStyle='#ffd45b';g.shadowBlur=18;g.shadowColor='#ffd45b';g.beginPath();g.arc(q.x,q.y,9,0,7);g.fill();g.shadowBlur=0});
g.fillStyle='#55d8ff';g.shadowBlur=20;g.shadowColor='#55d8ff';g.beginPath();g.roundRect(160,ground-68+py+(slide?30:0),slide?65:44,slide?36:68,12);g.fill();g.shadowBlur=0;
g.fillStyle='white';g.font='bold 15px system-ui';g.fillText('SPACE / UP: JUMP     DOWN: SLIDE',24,35)}

function loop(now){let dt=Math.min((now-last)/16.67||1,2);last=now;if(active&&!paused){t+=dt;update(dt);$('score').textContent=score}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script><script src="cyber-player.js"></script>
</body></html>
