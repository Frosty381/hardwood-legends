<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dungeon Quest | CYBER</title><style>*{box-sizing:border-box}body{margin:0;background:#080910;color:#f5f6fb;font:14px system-ui;overflow:hidden}header{height:58px;background:#0d1120;border-bottom:1px solid #ffffff22;display:flex;align-items:center;justify-content:space-between;padding:0 18px}a,button{color:white;background:#171d31;border:1px solid #ffffff30;border-radius:7px;padding:9px 13px;text-decoration:none;font-weight:800;cursor:pointer}main{height:calc(100vh - 58px);display:grid;place-items:center;position:relative;padding:12px}canvas{width:min(100%,1200px);height:min(100%,720px);border:1px solid #ffffff30;border-radius:12px;background:#0b1020}.hud{position:absolute;top:25px;left:25px;right:25px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 8px #000}.overlay{position:absolute;inset:12px;display:grid;place-items:center;background:#050711bb;backdrop-filter:blur(7px)}.panel{width:min(460px,90%);background:#141a2b;border:1px solid #ffffff30;border-radius:15px;padding:28px;text-align:center;box-shadow:0 20px 80px #000}h1{font-size:clamp(38px,7vw,64px);line-height:.9;margin:14px 0;text-transform:uppercase}p{color:#b5bfd4;line-height:1.7}.cyan{color:#55d8ff}.primary{background:linear-gradient(110deg,#9d6bff,#547cff);border:0;padding:13px 22px}</style></head><body>
<header><b><span class="cyan">C</span> CYBER / DUNGEON QUEST</b><div><a href="index.html">CYBER HOME</a> <button id="pause">PAUSE</button> <button id="sound">SOUND ON</button></div></header>
<main><canvas id="c" width="1200" height="720"></canvas><div class="hud"><span>DUNGEON QUEST</span><span>SCORE: <b id="score">0</b></span></div>
<div class="overlay" id="overlay"><div class="panel"><div class="cyan">CYBER ORIGINAL</div><h1>Dungeon Quest</h1><p id="desc">Explore the crystal vault, fight dungeon creatures and collect glowing crystals.</p><p><small>WASD / ARROWS MOVE · MOUSE AIM · HOLD CLICK TO ATTACK · P TO PAUSE</small></p><button class="primary" id="start">START GAME</button></div></div></main>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector(s);
let active=false,paused=false,sound=true,score=0,t=0,last=0,keys={},parts=[];
function beep(f=500){if(!sound)return;try{let a=new AudioContext(),o=a.createOscillator(),v=a.createGain();o.frequency.value=f;o.connect(v);v.connect(a.destination);v.gain.value=.025;o.start();v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.stop(a.currentTime+.1)}catch(e){}}
function start(){active=true;paused=false;score=0;t=0;parts=[];resetGame();$('overlay').style.display='none';$('score').textContent=0}
function end(){$('overlay').style.display='grid';$('start').textContent='PLAY AGAIN';$('desc').textContent='Run complete — score: '+score+'. Try again and beat your record.';active=false}
function toggle(){if(!active)return;paused=!paused;$('overlay').style.display=paused?'grid':'none';$('start').textContent='RESUME';$('desc').textContent='Game paused. Ready when you are.'}
$('start').onclick=()=>{if(active&&paused){toggle();return}start()};$('pause').onclick=toggle;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='SOUND '+(sound?'ON':'OFF')};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='p')toggle()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let hero={x:600,y:360},foes=[],gems=[],shots=[],mouse={x:700,y:350,down:false},hp=100;
function resetGame(){hero={x:600,y:360};foes=[];gems=[];shots=[];hp=100}
c.onpointermove=e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*1200/r.width;mouse.y=(e.clientY-r.top)*720/r.height};c.onpointerdown=()=>mouse.down=true;window.onpointerup=()=>mouse.down=false;
function update(d){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),n=Math.hypot(dx,dy)||1;hero.x=Math.max(25,Math.min(1175,hero.x+dx/n*4*d));hero.y=Math.max(25,Math.min(695,hero.y+dy/n*4*d));
if(t%75<d){let a=Math.random()*6.28;foes.push({x:600+Math.cos(a)*650,y:360+Math.sin(a)*430,h:2,r:17,s:1+Math.random()})}
if(mouse.down&&t%14<d){let a=Math.atan2(mouse.y-hero.y,mouse.x-hero.x);shots.push({x:hero.x,y:hero.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,l:60});beep(500)}
shots.forEach(s=>{s.x+=s.vx*d;s.y+=s.vy*d;s.l-=d});shots=shots.filter(s=>s.l>0);
foes.forEach(e=>{let a=Math.atan2(hero.y-e.y,hero.x-e.x);e.x+=Math.cos(a)*e.s*d;e.y+=Math.sin(a)*e.s*d;shots.forEach(s=>{if(Math.hypot(s.x-e.x,s.y-e.y)<e.r){s.l=0;e.h--;if(e.h<=0){e.dead=true;score+=10;gems.push({x:e.x,y:e.y})}}});if(Math.hypot(hero.x-e.x,hero.y-e.y)<e.r+14){hp-=.22*d;if(hp<=0)end()}});foes=foes.filter(e=>!e.dead);
gems.forEach(q=>{if(Math.hypot(hero.x-q.x,hero.y-q.y)<24){q.got=true;score+=25;hp=Math.min(100,hp+8);beep(900)}});gems=gems.filter(q=>!q.got)}
function draw(){g.fillStyle='#111323';g.fillRect(0,0,1200,720);for(let y=0;y<720;y+=64)for(let x=0;x<1200;x+=64){g.fillStyle=(x+y)%128?'#171b2c':'#14182a';g.fillRect(x+2,y+2,60,60)}
g.strokeStyle='#b18cff66';g.lineWidth=7;g.strokeRect(10,10,1180,700);gems.forEach(q=>{g.fillStyle='#65ffd3';g.beginPath();g.moveTo(q.x,q.y-10);g.lineTo(q.x+9,q.y);g.lineTo(q.x,q.y+10);g.lineTo(q.x-9,q.y);g.fill()});
shots.forEach(s=>{g.fillStyle='#e2d4ff';g.beginPath();g.arc(s.x,s.y,5,0,7);g.fill()});foes.forEach(e=>{g.fillStyle='#a63c61';g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill()});
g.fillStyle='#55d8ff';g.shadowBlur=20;g.shadowColor='#55d8ff';g.beginPath();g.arc(hero.x,hero.y,17,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#333';g.fillRect(24,675,180,12);g.fillStyle='#65ffd3';g.fillRect(24,675,180*hp/100,12)}

function loop(now){let dt=Math.min((now-last)/16.67||1,2);last=now;if(active&&!paused){t+=dt;update(dt);$('score').textContent=score}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
